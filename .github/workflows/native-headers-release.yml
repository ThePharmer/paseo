name: Native headers APK release

# Publishes a fork-only Android APK for every upstream release: the upstream
# release tag plus the fork's native direct-connection headers commit
# (getpaseo/paseo#4290). Lives on fork main because schedules only run there.
# Polls every 15 minutes; a run with no new upstream tag ends in seconds.
# A dispatch with test_branch also cherry-picks that branch's commits (linear
# history based on the upstream tag), always builds, and publishes only to a separate
# <tag>-native-headers-test prerelease. The <tag>-native-headers release is untouched.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag to build (blank = latest upstream release)"
        required: false
        default: ""
        type: string
      force:
        description: "Rebuild even if the fork release already exists (replaces its APK and notes)"
        required: false
        default: false
        type: boolean
      test_branch:
        description: "Test build: fork branch, rebased onto the upstream tag with no merges, whose commits are cherry-picked; publishes only to the <tag>-native-headers-test prerelease (blank = normal release)"
        required: false
        default: ""
        type: string

concurrency:
  # Test builds use their own group so a queued schedule run cannot cancel a pending test dispatch.
  group: ${{ inputs.test_branch && 'native-headers-release-test' || 'native-headers-release' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: getpaseo/paseo
  # A single squashed commit holding the whole feat/native-direct-connection-headers
  # branch, rebased onto the upstream tag it targets. Only this one commit is
  # cherry-picked, so when the feature branch gains commits or the upstream tag
  # moves, re-squash the branch onto the new tag and re-point both values here.
  FEATURE_COMMIT: 4384d05accf6c03120ef0fc54a2f24b97d9b13a4
  FEATURE_BRANCH: release/native-headers-v0.9.0
  # Fork-only fixes cherry-picked after the feature, in order, until upstream
  # ships them. One "<sha> <branch> <upstream PR>" per line; the branch is
  # fetched so the sha is reachable. A sha already in the tag is skipped.
  EXTRA_FIXES: |
    1f33b1a024fd0efb87f90f5838d0e1904fed5081 fix/question-card-multiselect-other getpaseo/paseo#4372
    c340c5c0d6e88466667b83a2fd13368ecb3eeb19 fix/native-download-headers getpaseo/paseo#4290

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      fork_tag: ${{ steps.resolve.outputs.fork_tag }}
      upstream_url: ${{ steps.resolve.outputs.upstream_url }}
      needed: ${{ steps.resolve.outputs.needed }}
      test_branch: ${{ steps.resolve.outputs.test_branch }}
    steps:
      - name: Resolve the upstream tag and the fork release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
          TEST_BRANCH: ${{ inputs.test_branch }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
            upstream_url="https://github.com/$UPSTREAM_REPO/releases/tag/$tag"
          else
            tag="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)"
            upstream_url="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .html_url)"
          fi
          fork_tag="${tag}-native-headers"

          needed=true
          if [[ -n "${TEST_BRANCH:-}" ]]; then
            if ! git check-ref-format "refs/heads/$TEST_BRANCH"; then
              echo "::error::test_branch '$TEST_BRANCH' is not a valid branch name."
              exit 1
            fi
            # Test builds always run and never touch the daily-driver release or its tag.
            fork_tag="${tag}-native-headers-test"
            echo "Test build of $TEST_BRANCH; publishing to prerelease $fork_tag."
          elif gh release view "$fork_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "${FORCE:-false}" == "true" ]]; then
              echo "Fork release $fork_tag already exists; force set, rebuilding and replacing it."
            else
              needed=false
              echo "Fork release $fork_tag already exists; nothing to do."
            fi
          fi

          {
            echo "tag=$tag"
            echo "fork_tag=$fork_tag"
            echo "upstream_url=$upstream_url"
            echo "needed=$needed"
            echo "test_branch=${TEST_BRANCH:-}"
          } >> "$GITHUB_OUTPUT"
          echo "upstream=$tag fork=$fork_tag needed=$needed test_branch=${TEST_BRANCH:-none}"

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      signing: ${{ steps.signing.outputs.mode }}
      push: ${{ steps.push.outputs.mode }}
      cherry_picked: ${{ steps.source.outputs.cherry_picked }}
      fixes: ${{ steps.source.outputs.fixes }}
      commit: ${{ steps.source.outputs.commit }}
      test_commits: ${{ steps.source.outputs.test_commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare and test release workflow tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          node --test scripts/native-headers-release.test.mjs
          "$RUNNER_TEMP/release-tools/bin/python" scripts/native-headers-workflow-filters.test.py
          cp scripts/native-headers-workflow-filters.py "$RUNNER_TEMP/release-tools/filters.py"
          cp scripts/native-headers-apply-test-branch.sh "$RUNNER_TEMP/release-tools/apply-test-branch.sh"

      - name: Build the source tree for the release
        id: source
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TEST_BRANCH: ${{ needs.resolve.outputs.test_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"
          git fetch --no-tags origin "refs/heads/$FEATURE_BRANCH:refs/remotes/fork/$FEATURE_BRANCH"
          git checkout --detach "refs/tags/$TAG"

          if git grep -q 'headers: z.record' "$TAG" -- packages/protocol/src/host-connection-schema.ts; then
            echo "Feature is already in $TAG; skipping the cherry-pick."
            cherry_picked=false
          elif git cherry-pick -x "$FEATURE_COMMIT"; then
            cherry_picked=true
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd' ' -)"
            git cherry-pick --abort || true
            echo "::error::Cherry-picking $FEATURE_COMMIT onto $TAG conflicted in: ${conflicts:-unknown}. Re-squash feat/native-direct-connection-headers onto $TAG on a new release/native-headers-<tag> branch, push it, update both FEATURE_COMMIT and FEATURE_BRANCH in this workflow, then re-run. No release was published."
            exit 1
          fi

          fixes=""
          while read -r sha branch pr; do
            [[ -z "${sha:-}" ]] && continue
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/fork/$branch"
            if git cherry-pick -x "$sha"; then
              fixes="${fixes:+$fixes, }${sha:0:9} ($pr)"
            elif [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
              git cherry-pick --skip
              echo "Fix $sha ($pr) is already in $TAG; skipped."
            else
              conflicts="$(git diff --name-only --diff-filter=U | paste -sd' ' -)"
              git cherry-pick --abort || true
              echo "::error::Cherry-picking fix $sha ($pr) onto $TAG conflicted in: ${conflicts:-unknown}. Rebase $branch onto $TAG, update EXTRA_FIXES in this workflow, then re-run. No release was published."
              exit 1
            fi
          done <<< "$EXTRA_FIXES"

          test_commits=""
          if [[ -n "$TEST_BRANCH" ]]; then
            test_commits="$(bash "$RUNNER_TEMP/release-tools/apply-test-branch.sh" "$TAG" "$TEST_BRANCH")"
          fi

          # The tag carries upstream's workflows, not those on fork main. Exclude
          # fork publication tags in that tree before an App-authenticated push.
          "$RUNNER_TEMP/release-tools/bin/python" "$RUNNER_TEMP/release-tools/filters.py" .github/workflows
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "Exclude native-headers publication tags from upstream workflows"
          fi

          {
            echo "cherry_picked=$cherry_picked"
            echo "fixes=$fixes"
            echo "commit=$(git rev-parse HEAD)"
            echo "test_commits=$test_commits"
          } >> "$GITHUB_OUTPUT"

      - name: Create App token for publishing preflight
        id: preflight_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Check tag publishing before building
        id: publish_check
        env:
          GH_TOKEN: ${{ steps.preflight_token.outputs.token }}
          FORK_TAG: ${{ needs.resolve.outputs.fork_tag }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          release_ref="refs/tags/$FORK_TAG"
          git check-ref-format "$release_ref"
          # Record the exact ref object (including annotated tags) for the final lease.
          existing="$(git ls-remote --refs origin "$release_ref")"
          echo "previous_tag=${existing%%$'\t'*}" >> "$GITHUB_OUTPUT"

          # --dry-run does not exercise GitHub's server-side workflow permission check.
          # Use the actual source commit, but never expose an unbuilt release tag.
          probe_ref="refs/tags/native-headers-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          commit="$(git rev-parse HEAD)"
          created=false
          cleanup() {
            if [[ "$created" == "true" ]]; then
              if ! git push --force-with-lease="$probe_ref:$commit" origin ":$probe_ref"; then
                echo "::error::Could not remove temporary tag $probe_ref. Remove it after checking its target; no APK build will start."
                exit 1
              fi
            fi
          }
          trap cleanup EXIT
          if ! git push --force-with-lease="$probe_ref:" origin "$commit:$probe_ref"; then
            echo "::error::Tag publishing preflight failed. Check the push error above; if GitHub reports missing workflows permission, configure publishing credentials with Contents and Workflows write access. No APK build was started and the release tag was not changed."
            exit 1
          fi
          created=true

      - name: Configure APK signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" \
                && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            # Read by the eas-build.gradle script that configureEasBuildAsync installs.
            jq -n \
              --arg keystorePath "$keystore" \
              --arg keystorePassword "$ANDROID_KEYSTORE_PASSWORD" \
              --arg keyAlias "$ANDROID_KEY_ALIAS" \
              --arg keyPassword "$ANDROID_KEY_PASSWORD" \
              '{android: {keystore: {keystorePath: $keystorePath, keystorePassword: $keystorePassword, keyAlias: $keyAlias, keyPassword: $keyPassword}}}' \
              > packages/app/credentials.json
            echo "EAS_BUILD=1" >> "$GITHUB_ENV"
            echo "mode=keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Android keystore secrets set; the APK will be signed with the Expo template debug key."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      # Push notifications need a Firebase client config baked into the APK and
      # an Expo project that holds the matching FCM service-account key. Upstream
      # app.config.js names the maintainers' Expo project, which this fork cannot
      # use, so the fork's own project id is patched in for the build only.
      - name: Configure Firebase push credentials
        id: push
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" || -z "${EXPO_PROJECT_ID:-}" ]]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret or EXPO_PROJECT_ID variable is not set; the APK will not support push notifications."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$EXPO_PROJECT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::EXPO_PROJECT_ID is not a UUID."
            exit 1
          fi
          if [[ -n "${EXPO_OWNER:-}" && ! "$EXPO_OWNER" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::EXPO_OWNER is not a valid Expo account slug."
            exit 1
          fi

          # app.config.js falls back to this path when GOOGLE_SERVICES_FILE_PROD is unset.
          mkdir -p packages/app/.secrets
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > packages/app/.secrets/google-services.prod.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "sh.paseo")' \
            packages/app/.secrets/google-services.prod.json >/dev/null \
            || { echo "::error::google-services.json has no Android client for package sh.paseo."; exit 1; }

          node - "$EXPO_PROJECT_ID" "${EXPO_OWNER:-}" <<'EOF'
          const fs = require("node:fs");
          const [projectId, owner] = process.argv.slice(2);
          const file = "packages/app/app.config.js";
          const before = fs.readFileSync(file, "utf8");
          let src = before.replace(/projectId:\s*"[0-9a-f-]{36}"/, `projectId: "${projectId}"`);
          if (owner) {
            src = src.replace(/owner:\s*"[^"]+"/, `owner: "${owner}"`);
          }
          if (src === before) {
            console.error("app.config.js: projectId/owner pattern not found; upstream config changed.");
            process.exit(1);
          }
          fs.writeFileSync(file, src);
          EOF
          echo "mode=firebase" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # setup-gradle owns Gradle caching and stops the daemon in its post step.
      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      # The client tests spawn a plain node subprocess that resolves
      # @getpaseo/relay through its "node" export condition, which points at
      # dist. Upstream's sdk-tests job builds relay for the same reason.
      - name: Build workspace packages
        run: |
          npm run build:relay
          npm run build:app-deps
          npm --prefix packages/app run build:terminal-webview

      # The feature is cherry-picked onto a tag it was never written against;
      # these suites are the ones the change touches.
      - name: Test the feature on this tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TEST_BRANCH: ${{ needs.resolve.outputs.test_branch }}
        run: |
          set -uo pipefail
          fail() {
            if [[ -n "$TEST_BRANCH" ]]; then
              echo "::error::Test build: $1 fails with test branch $TEST_BRANCH applied on upstream $TAG; the test commits may be the cause. No APK was built and no release was published."
              exit 1
            fi
            echo "::error::The native headers feature no longer passes $1 on upstream $TAG. Fix it on feat/native-direct-connection-headers, re-squash onto $TAG on a new release/native-headers-<tag> branch, push it, and update both FEATURE_COMMIT and FEATURE_BRANCH in this workflow. No APK was built and no release was published."
            exit 1
          }

          for pkg in protocol client app; do
            (cd "packages/$pkg" && npx tsgo --noEmit) || fail "the typecheck in packages/$pkg"
          done

          for pkg in protocol client; do
            (cd "packages/$pkg" && npx vitest run) || fail "the packages/$pkg test suite"
          done

          (cd packages/app && npx vitest run --testTimeout=60000 \
            src/utils/test-daemon-connection.test.ts \
            src/utils/connection-headers.test.ts \
            src/types/host-connection.test.ts \
            src/runtime/host-runtime.test.ts \
            src/i18n/resources.test.ts \
            src/i18n/locales.test.ts \
            src/components/question-form-card-core.test.ts) || fail "the targeted packages/app tests"

      - name: Prebuild and assemble the release APK
        env:
          APP_VARIANT: production
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          PUSH_MODE: ${{ steps.push.outputs.mode }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=1
            -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          # Hosted runners (4 CPU, 16 GB RAM, 3 GB swap) give this build no
          # headroom. Sampled on v0.9.0: hermesc went from 1.4 GB to 5.8 GB in
          # 20 s and was still climbing on top of a 2.5 GB Gradle JVM and a
          # 1.7 GB Kotlin daemon when the runner killed the step. GitHub
          # reports that as "The operation was canceled" or exit code 143 with
          # no further output (actions/runner#2468). So: compile Kotlin inside
          # the Gradle JVM, skip the Hermes source map, leave out the unused
          # C++ prototype module, add swap as a backstop, and sample memory so
          # a failure leaves evidence in the log.
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap -q /swapfile2 && sudo swapon /swapfile2
          echo "cpus=$(nproc)"
          free -m
          df -h /
          (
            while true; do
              printf '[mem %s] %s disk_avail=%sM top: %s\n' "$(date -u +%H:%M:%S)" \
                "$(free -m | awk '/Mem:/{printf "used=%dM avail=%dM", $3, $7} /Swap:/{printf " swap=%dM/%dM", $3, $2}')" \
                "$(df -m --output=avail / | tail -n 1 | tr -d ' ')" \
                "$(ps -eo rss=,comm= --sort=-rss | head -n 4 | awk '{printf "%s=%dM ", $2, $1/1024}')"
              sleep 20
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          cd packages/app
          # modules/paseo-diff-prototype is an Android-only C++ layout experiment
          # that the app never calls (its README says so). It links Skia for all
          # four ABIs on every build, so leave it out of the fork APK.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.expo = pkg.expo ?? {};
            pkg.expo.autolinking = pkg.expo.autolinking ?? {};
            pkg.expo.autolinking.exclude = [...new Set([...(pkg.expo.autolinking.exclude ?? []), "paseo-diff-prototype"])];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npx expo prebuild --platform android --clean --non-interactive
          if [[ "$PUSH_MODE" == "firebase" && ! -f android/app/google-services.json ]]; then
            echo "::error::Push credentials were configured but prebuild did not emit android/app/google-services.json."
            exit 1
          fi
          if [[ "$SIGNING_MODE" == "keystore" ]]; then
            node -e '(async () => require("expo/node_modules/@expo/config-plugins").AndroidConfig.EasBuild.configureEasBuildAsync(process.cwd()))().catch((error) => { console.error(error); process.exitCode = 1; })'
          fi
          # Hermes source maps are the bulk of hermesc's memory and nothing
          # consumes them for a fork APK. React Native's bundle task only
          # composes source maps when the flag is present.
          node - <<'EOF'
          const fs = require("fs");
          const file = "android/app/build.gradle";
          const src = fs.readFileSync(file, "utf8");
          const before = '// hermesFlags = ["-O", "-output-source-map"]';
          if (!src.includes(before)) {
            console.error("android/app/build.gradle: hermesFlags template line not found; upstream template changed.");
            process.exit(1);
          }
          fs.writeFileSync(file, src.replace(before, 'hermesFlags = ["-O"]'));
          EOF
          cd android
          # Phones are arm64; dropping armeabi-v7a/x86/x86_64 cuts the APK to
          # roughly a third. This APK will not run on x86 emulators.
          #
          # Maven Central rate-limits GitHub's shared runner addresses (HTTP
          # 429) and Gradle does not retry that. Completed tasks are up to date
          # on the retry, so a second attempt only redoes the failed download.
          gradle_build() {
            ./gradlew \
              :app:assembleRelease \
              -PreactNativeArchitectures=arm64-v8a \
              --max-workers=1 \
              -x lint \
              -x lintVitalAnalyzeRelease \
              -x lintVitalRelease \
              -x generateReleaseLintModel \
              -x generateReleaseLintVitalModel \
              -Pkotlin.compiler.execution.strategy=in-process \
              2>&1 | tee "$RUNNER_TEMP/gradle-attempt.log"
            return "${PIPESTATUS[0]}"
          }
          for attempt in 1 2 3; do
            if gradle_build; then
              break
            fi
            if [[ "$attempt" == 3 ]] || ! grep -q -E "Received status code 429|Could not GET|Could not resolve" "$RUNNER_TEMP/gradle-attempt.log"; then
              echo "::group::kernel log tail"; sudo dmesg 2>/dev/null | tail -n 60; echo "::endgroup::"
              exit 1
            fi
            echo "::warning::Gradle attempt $attempt failed on a dependency download; retrying in $((attempt * 60))s."
            sleep $((attempt * 60))
          done

      - name: Name and verify the APK
        id: artifact
        env:
          FORK_TAG: ${{ needs.resolve.outputs.fork_tag }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          name="paseo-${FORK_TAG}-android.apk"
          cp packages/app/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          certs="$("$apksigner" verify --print-certs "$RUNNER_TEMP/$name")"
          printf '%s\n' "$certs" | head -n 4
          if [[ "$SIGNING_MODE" == "keystore" ]] && printf '%s' "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::Keystore secrets were set but the APK is debug-signed; check credentials.json handling."
            exit 1
          fi
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.artifact.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30

      # The release job has no copy of the cherry-picked commit, so the tag is
      # pushed here (tag ref only, no branch) once the build has succeeded.
      - name: Create App token for release tag publishing
        id: publish_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Push the fork release tag
        env:
          FORK_TAG: ${{ needs.resolve.outputs.fork_tag }}
          GH_TOKEN: ${{ steps.publish_token.outputs.token }}
          PREVIOUS_TAG: ${{ steps.publish_check.outputs.previous_tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          release_ref="refs/tags/$FORK_TAG"
          # One compare-and-swap: a rejected push preserves the old tag and release.
          # An empty expected value means the tag must still be absent.
          git push --force-with-lease="$release_ref:$PREVIOUS_TAG" origin "$COMMIT:$release_ref"

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/apk

      - name: Publish the fork release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          FORK_TAG: ${{ needs.resolve.outputs.fork_tag }}
          UPSTREAM_URL: ${{ needs.resolve.outputs.upstream_url }}
          ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          SIGNING_MODE: ${{ needs.build.outputs.signing }}
          PUSH_MODE: ${{ needs.build.outputs.push }}
          CHERRY_PICKED: ${{ needs.build.outputs.cherry_picked }}
          FIXES: ${{ needs.build.outputs.fixes }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TEST_BRANCH: ${{ needs.resolve.outputs.test_branch }}
          TEST_COMMITS: ${{ needs.build.outputs.test_commits }}
        run: |
          set -euo pipefail

          title="Paseo $TAG (native headers)"
          test_notes=""
          latest_flag=()
          if [[ -n "$TEST_BRANCH" ]]; then
            title="Paseo $TAG (native headers TEST BUILD: $TEST_BRANCH)"
            test_notes="**TEST BUILD** of work-in-progress branch $TEST_BRANCH, not the daily-driver $TAG-native-headers release. Test commits cherry-picked after the feature and fixes: $TEST_COMMITS."$'\n\n'
            latest_flag=(--latest=false)
          fi

          if [[ "$CHERRY_PICKED" == "true" ]]; then
            feature_line="Cherry-picked $FEATURE_COMMIT (getpaseo/paseo#4290) onto $TAG."
          else
            feature_line="Already present in upstream $TAG; no cherry-pick was needed."
          fi

          if [[ "$SIGNING_MODE" == "keystore" ]]; then
            signing_line="Signed with the fork's release keystore, so later builds from this workflow install over this one."
            install_line="Install: adb install -r $ARTIFACT, or open the APK on the device."
          else
            signing_line="DEBUG-SIGNED. No keystore secrets are configured on this repository, so the Expo template debug key was used. Anyone can produce an APK with this signature; treat it as a test build, and note that a future keystore-signed build will NOT install over it."
            install_line="Install: uninstall any existing sh.paseo build first (adb uninstall sh.paseo), then adb install $ARTIFACT."
          fi

          if [[ -n "${FIXES:-}" ]]; then
            fixes_line="Fork-only fixes cherry-picked on top: $FIXES."
          else
            fixes_line="Fork-only fixes cherry-picked on top: none."
          fi

          if [[ "$PUSH_MODE" == "firebase" ]]; then
            push_line="Push notifications: enabled. Built with the fork's Firebase client config and Expo project, so the daemon can register a push token for this install."
          else
            push_line="Push notifications: NOT available. No Firebase credentials were configured on this repository."
          fi

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ${test_notes}Fork build of upstream $TAG with the native direct-connection headers feature.

          - Upstream release: $UPSTREAM_URL
          - Feature: $feature_line
          - $fixes_line
          - Signing: $signing_line
          - $push_line
          - Architecture: arm64-v8a only, to keep the APK small. Not for x86 emulators.
          - applicationId is sh.paseo, the same id as the Play Store build. This APK REPLACES the store app; the two cannot coexist on one device.
          - $install_line
          - Fork publication tags are excluded from upstream push workflows in the release source to prevent competing builds and release updates.
          - Built from commit $COMMIT.
          EOF

          if gh release view "$FORK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The tag is updated in place; keep the existing release published.
            gh release edit "$FORK_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease \
              "${latest_flag[@]}" \
              --draft=false
            gh release upload "$FORK_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$RUNNER_TEMP/apk/$ARTIFACT"
          else
            gh release create "$FORK_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease \
              "${latest_flag[@]}" \
              "$RUNNER_TEMP/apk/$ARTIFACT"
          fi
