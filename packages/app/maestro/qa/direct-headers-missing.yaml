# Negative control for direct-headers-gate.yaml: the same host and port with no
# header row. The gate answers the handshake with a 302 and the Add Host probe
# must surface a connection failure instead of adding the host.
# See direct-headers-gate.yaml for the conventions used here.
appId: sh.paseo
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: ".*(isn't responding|keeps stopping).*"
    commands:
      - tapOn: "(?i)(Wait|Close app|OK)"

- runFlow:
    when:
      visible: "Open in.*Paseo.*\\?"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 90000

# Opening the sheet occasionally stalls with only its header on screen (about
# one launch in four on the CI emulator; the open animation never progresses).
# There is no safe in-flow recovery, so the driver script re-runs the whole
# flow, which relaunches the app with a clean state.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "welcome-direct-connection"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "direct-host-input"
    timeout: 10000

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "direct-host-input"
          point: "95%,50%"
          waitToSettleTimeoutMs: 1500
      - eraseText: 100
      - inputText: "10.0.2.2"
      - assertVisible:
          id: "direct-host-input"
          text: "10.0.2.2"

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "direct-port-input"
          point: "95%,50%"
          waitToSettleTimeoutMs: 1500
      - eraseText: 100
      - inputText: "6768"
      - assertVisible:
          id: "direct-port-input"
          text: "6768"

- extendedWaitUntil:
    visible:
      id: "direct-host-submit"
    timeout: 10000
- tapOn:
    id: "direct-host-submit"

- extendedWaitUntil:
    visible: "We failed to connect.*"
    timeout: 30000
- takeScreenshot: 04-no-header-rejected-by-gate
