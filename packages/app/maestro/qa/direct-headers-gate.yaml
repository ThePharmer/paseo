# QA evidence for custom direct-connection headers on Android.
#
# The daemon sits behind scripts/qa/header-gate-proxy.mjs on the runner host,
# reachable from the emulator at 10.0.2.2:6768. The proxy answers every
# handshake without "X-Paseo-Gate: qa-gate-7f3a" with a 302, like Cloudflare
# Access does for a non-browser client. This flow adds the header under
# Direct connection > Advanced and proves the app comes up Online through it.
#
# Conventions, all verified against Maestro 2.5.1 source or docs:
# - Text matchers are full-match regexes, hence ".*Online.*".
# - The emulator runs with the soft keyboard suppressed (hardware keyboard
#   flag plus show_ime_with_hard_keyboard=0). inputText injects key events,
#   not IME input, so typing still works and nothing ever covers Connect.
# - A modal system dialog hides everything behind it from UiAutomator; the
#   runFlow guard clears one that appears before the first wait.
# - Visibility is bounds-only, so a sheet still sliding in already counts as
#   visible. Wait for pixels to stop moving, then for the first input.
# - tapOn taps the element centre, which puts the caret mid-text; typing
#   retries tap at 95% of the width so eraseText clears from the end.
# - inputText can drop characters (maestro#395); every typed value is
#   asserted and the retry block re-types from a cleared field.
appId: sh.paseo
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: ".*(isn't responding|keeps stopping).*"
    commands:
      - tapOn: "(?i)(Wait|Close app|OK)"

- runFlow:
    when:
      visible: "Open in.*Paseo.*\\?"
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 90000

- tapOn:
    id: "welcome-direct-connection"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "direct-host-input"
    timeout: 10000

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "direct-host-input"
          point: "95%,50%"
          waitToSettleTimeoutMs: 1500
      - eraseText: 100
      - inputText: "10.0.2.2"
      - assertVisible:
          id: "direct-host-input"
          text: "10.0.2.2"

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "direct-port-input"
          point: "95%,50%"
          waitToSettleTimeoutMs: 1500
      - eraseText: 100
      - inputText: "6768"
      - assertVisible:
          id: "direct-port-input"
          text: "6768"

- tapOn:
    id: "direct-host-advanced-toggle"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "direct-header-add"
    timeout: 5000
- takeScreenshot: 01-advanced-with-empty-headers

- tapOn:
    id: "direct-header-add"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "direct-header-name-0"
    timeout: 5000

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "direct-header-name-0"
          point: "95%,50%"
          waitToSettleTimeoutMs: 1500
      - eraseText: 100
      - inputText: "X-Paseo-Gate"
      - assertVisible:
          id: "direct-header-name-0"
          text: "X-Paseo-Gate"

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "direct-header-value-0"
          point: "95%,50%"
          waitToSettleTimeoutMs: 1500
      - eraseText: 100
      - inputText: "qa-gate-7f3a"
      - assertVisible:
          id: "direct-header-value-0"
          text: "qa-gate-7f3a"

- takeScreenshot: 02-header-row-filled

- extendedWaitUntil:
    visible:
      id: "direct-host-submit"
    timeout: 10000
- tapOn:
    id: "direct-host-submit"

# A successful probe saves the host and lands on the daemon home screen. The
# "Online" badge lives in the host sidebar, so assert the home screen itself.
- extendedWaitUntil:
    visible: "Add a project"
    timeout: 90000
- assertNotVisible:
    id: "add-host-modal"
- takeScreenshot: 03-connected-through-header-gate
