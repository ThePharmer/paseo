apply plugin: 'com.android.library'

group = 'sh.paseo.gcpressure'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  namespace "sh.paseo.gcpressure"
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }
  defaultConfig {
    externalNativeBuild {
      cmake {
        abiFilters(*reactNativeArchitectures())
        // jsi objects and exceptions cross into libjsi.so, so both sides need the shared STL.
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-std=c++20 -O2 -fexceptions -frtti"
      }
    }
  }
  externalNativeBuild {
    cmake { path "CMakeLists.txt" }
  }
  buildFeatures {
    prefab true
  }
  packagingOptions {
    // Link-time inputs from the react-android prefab; the app packages its own copies.
    excludes += [
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libreactnative.so",
    ]
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
